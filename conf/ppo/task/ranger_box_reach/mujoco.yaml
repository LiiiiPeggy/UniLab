# @package _global_
training:
  task_name: RangerBoxReach
  sim_backend: mujoco
  # Playback defaults: 3x4 grid (12 envs, 4 columns fixed — rows =
  # ceil(12/4)=3), cells spaced 3 m.  cam_azimuth=0 views ACROSS the columns
  # (camera on the −x side): all four columns line up horizontally with
  # uniform robot size; azimuth=90 looks down the long grid axis (near column
  # huge/clipped, far column tiny).  cam_distance=11.0 is an EXPLICIT override
  # that beats auto-fit (verified: all 12 robots + markers/trails/text fit the
  # frame at 3 m spacing); set cam_distance=null to return to the projected-
  # bounds auto-fit (cam_fit_margin 0.75 m, ≈11.5 m at 3 m spacing).
  play_env_num: 12
  render_grid_cols: 4
  render_spacing: 3.0
  cam_distance: 11.0
  cam_azimuth: 0.0

algo:
  num_envs: 256
  num_steps_per_env: 128
  max_iterations: 1000
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic

  policy:
    init_noise_std: 0.3
    actor_hidden_dims: [256, 128, 64]
    critic_hidden_dims: [256, 128, 64]

  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
    num_mini_batches: 4

reward:
  scales:
    # ee_distance was a positive per-step bonus near the goal: a policy could
    # hover around the target and farm it without ever holding success.  Zeroed
    # in Run 4A; progress + the negative L2 penalty reward approaching, while
    # the event bonuses below reward actual completion.
    ee_distance: 0.0
    ee_distance_l2: -0.5
    ee_progress: 5.0
    # Event-based (unscaled by ctrl_dt): fire once per episode on first entry,
    # plus a terminal bonus on the step held-success is achieved.
    success_once_10cm: 2.0
    success_once_05cm: 1.0
    success_hold_10cm: 5.0
    base_vel_xy: -0.01
    base_stop_near_goal: -0.10
    base_vel_z: 0.0
    base_vel_yaw: -0.005
    arm_dof_vel: -0.001
    arm_dof_acc: -1.0e-6
    arm_joint_limits: -1.0
    arm_collision: 0.0
    arm_base_clearance: -5.0
    arm_base_collision: -10.0
    torques: 0.0
    base_orientation: 0.0
    base_height: 0.0
    action_rate: -0.005
    similar_to_default: -0.002
    alive: 0.0
  sigma_ee: 0.20

env:
  max_episode_seconds: 10.0
  init_state:
    pos: [0.0, 0.0, 0.415]
  # Manipulation-ready arm pose: folded (EE 0.45 m from armbase), Jacobian
  # condition 1.6, no collision, gravity-settle drift ~0.02 rad (gravcomp=0).
  # Found by scripts/manip_loco/find_ranger_box_ready_pose.py.  Reset loads this
  # instead of the (extended, singular) gravity-hanging equilibrium.
  init_arm_pose: [-0.0793, 0.0031, -2.1214, -1.6912, 2.118, 1.1986]
  control_config:
    arm_action_scale: 0.01
    arm_max_delta_per_step: 0.01
    terminate_on_arm_limits: true
    engage_inner: 0.40
    engage_outer: 0.70
    simulate_action_latency: false
    arm_kp: [100.0, 110.0, 95.0, 50.0, 50.0, 50.0]
    arm_kd: [3.5, 3.8, 2.5, 1.5, 1.5, 1.5]
    gripper_kp: 50.0
    gripper_kd: 5.0
    gripper_hold_position: 0.0
  noise_config:
    level: 0.0
    scale_linvel: 0.1
    scale_gyro: 0.2
    scale_gravity: 0.05
    scale_joint_angle: 0.03
    scale_joint_vel: 0.5
    scale_ee_pos: 0.02
    scale_ee_goal: 0.01
  ik:
    damping: 0.02
    gain: 1.5
    dq_clip: 0.3
    use_orientation: false
    orientation_mode: target
    # Resolved-rate target controller (replaces the chase-current integration
    # that overshot).  controller_mode is "resolved_rate" (B), "resolved_rate_
    # damped" (C, velocity_damping), or "integrated" (A, old).  Ablation
    # (benchmark_ranger_box_ik_controller.py) showed velocity_damping HURTS
    # success (kv=0.05: 0.51 vs kv=0: 0.62), so kv is kept at 0.
    velocity_damping: 0.0
    controller_mode: resolved_rate
  goal_ee:
    # LOCAL goals (within the arm's reliable capture radius) vs EXTENDED goals
    # (require base navigation).  LOCAL uses true 3D radial distance from the
    # EE; radius ranges measured by benchmark_ranger_box_ik_capture_radius.py:
    # the arm reliably reaches (once10 > 0.9) only within ~0.15 m, so the
    # LOCAL range is [0.10, 0.15] and the capture region is 0.15/0.20.
    # EXTENDED is PLANAR: theta ~ U(-pi,pi), r_xy ~ U(extended_xy_radius_range)
    # and dz ~ U(extended_z_range) relative to the EE.  The SE(2) base cannot
    # change height, and the 3D radial sampler let |dz| exceed capture_outer on
    # ~54% of EXTENDED goals (extended_geometry_iter{150,199}.json: hold10
    # collapses 1.00 -> 0.18 across |dz| bins), so dz is bounded to +/-0.10.
    local_fraction: 0.30
    local_radius_range: [0.10, 0.15]
    extended_xy_radius_range: [0.30, 0.70]
    extended_z_range: [-0.10, 0.10]
    # Arm-capture region (EE-to-goal distance) for the arm-engagement gate.
    # capture_inner = the measured reliable capture radius (0.15 m); LOCAL
    # goals sit inside it (fully engaged); the blend runs to capture_outer.
    capture_inner: 0.15
    capture_outer: 0.20
    num_resample_attempts: 10
    init_ee_cart: [0.30, 0.0, 0.30]
  base_velocity_controller:
    max_lin_vel: 1.5
    # max_ang_vel 1.0 -> 0.78: the real AgileX Ranger max yaw rate is ~0.785
    # rad/s (hardware sheet); keeping 1.0 lets the policy rely on a spin rate
    # the real base cannot deliver (sim2real gap).  max_lin_vel stays within
    # the hardware limit (1.5 <= 1.5 m/s).
    max_ang_vel: 0.78
    action_scale_lin: 1.5
    action_scale_ang: 1.0
    tau: 0.05
    max_lin_acc: 1.5
    max_ang_acc: 3.0
    max_latency_steps: 4
    action_noise_scale: 0.05
    enable_latency: false
    enable_noise: false
    enable_wheel_visualization: false
    # Optional jerk limiter (da/dt bound).  Default OFF — ablation knob only;
    # zero max_*_jerk disables a channel.  Kept off so Run-4B behaviour is
    # unchanged unless explicitly enabled.
    enable_jerk_limit: false
    max_lin_jerk: 0.0
    max_ang_jerk: 0.0
    # When true, wheel visualization follows the Ranger motion mode
    # (Ackermann/Parallel/Spin) instead of the generic per-wheel swerve IK.
    mode_wheel_visualization: true
  # Hardware-compatible base command shaping (deadband/hysteresis + motion
  # mode), mirroring the real AgileX Ranger /cmd_vel semantics in ranger_base_node.
  # All thresholds are velocity units (m/s, rad/s).
  command_adapter:
    enable: true
    # Deadband/hysteresis (Schmitt trigger): channel ON once |v| > *_enter,
    # OFF once |v| < *_exit (enter > exit); holds between them.
    linear_deadband_enter: 0.05
    linear_deadband_exit: 0.03
    lateral_deadband_enter: 0.05
    lateral_deadband_exit: 0.03
    angular_deadband_enter: 0.05
    angular_deadband_exit: 0.03
    # vy is the real base's parallel-mode trigger: |vy| >= this -> PARALLEL
    # (vx+vy+wz passed); |vy| < this -> ACKERMAN with vy forced to 0.
    parallel_vy_threshold: 0.05
    # SPIN recognised when yaw dominates and translation is negligible.
    spin_angular_threshold: 0.10
    spin_linear_threshold: 0.05
    # Velocity limits (must match base_velocity_controller above).
    max_lin_vel: 1.5
    max_ang_vel: 0.78
    mode_wheel_visualization: true
  domain_rand:
    randomize_kp: false
    kp_multiplier_range: [0.9, 1.1]
    randomize_kd: false
    kd_multiplier_range: [0.9, 1.1]
    randomize_body_mass: false
    body_mass_multiplier_range: [0.9, 1.1]
    random_com: false
    com_offset_x: [-0.03, 0.03]
    randomize_ground_friction: false
    randomize_dof_armature: false
    dof_armature_multiplier_range: [0.8, 1.2]
    push_robots: false
  history:
    num_actor_history: 5
    num_critic_history: 5
  arm_stage:
    freeze_arm_joints: false
    disable_ee_goal_trajectory: false
    fixed_ee_goal_cart: [0.30, 0.0, 0.30]
